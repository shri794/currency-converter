
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Currency Converter.top</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #101827, #172554, #312e81);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 460px;
    }

    .brand {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .brand h1 span {
      color: #60a5fa;
    }

    .brand p {
      color: #cbd5e1;
      font-size: 14px;
    }

    .converter {
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 22px;
      padding: 25px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(15px);
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 14px;
      color: #cbd5e1;
      margin-bottom: 9px;
    }

    input, select {
      width: 100%;
      padding: 14px;
      border: 1px solid #475569;
      border-radius: 12px;
      background: #172033;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #60a5fa;
    }

    .swap-row {
      display: flex;
      justify-content: center;
      margin: -3px 0 17px;
    }

    .swap-btn {
      width: 46px;
      height: 46px;
      border: none;
      border-radius: 50%;
      background: #3b82f6;
      color: white;
      font-size: 23px;
      cursor: pointer;
      transition: 0.2s;
    }

    .swap-btn:hover {
      background: #2563eb;
      transform: rotate(180deg);
    }

    .convert-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, #3b82f6, #6366f1);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
      transition: 0.2s;
    }

    .convert-btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .result {
      background: rgba(15, 23, 42, 0.75);
      border-radius: 14px;
      padding: 20px;
      margin-top: 22px;
      text-align: center;
    }

    .result-label {
      color: #cbd5e1;
      font-size: 13px;
      margin-bottom: 10px;
    }

    #resultAmount {
      font-size: 30px;
      font-weight: bold;
      color: #86efac;
      overflow-wrap: anywhere;
    }

    #rateInfo {
      font-size: 12px;
      color: #cbd5e1;
      margin-top: 12px;
      line-height: 1.6;
    }

    #status {
      min-height: 18px;
      margin-top: 12px;
      text-align: center;
      color: #fbbf24;
      font-size: 13px;
    }

    .popular {
      margin-top: 23px;
    }

    .popular h3 {
      font-size: 15px;
      margin-bottom: 12px;
    }

    .currency-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .currency-chip {
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.13);
      padding: 9px 12px;
      border-radius: 20px;
      font-size: 12px;
      color: #e2e8f0;
      cursor: pointer;
    }

    .currency-chip:hover {
      background: #334155;
    }

    footer {
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
      margin-top: 22px;
    }

    @media (max-width: 400px) {
      .converter {
        padding: 18px;
      }

      .brand h1 {
        font-size: 27px;
      }

      #resultAmount {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <header class="brand">
      <h1>Currency Converter<span>.top</span></h1>
      <p>Fast, simple and reliable currency conversion</p>
    </header>

    <section class="converter">
      <div class="field">
        <label for="amount">Amount</label>
        <input
          type="number"
          id="amount"
          value="1"
          min="0"
          step="any"
          placeholder="Enter amount"
        >
      </div>

      <div class="field">
        <label for="fromCurrency">From currency</label>
        <select id="fromCurrency">
          <option value="USD">🇺🇸 USD - US Dollar</option>
          <option value="INR" selected>🇮🇳 INR - Indian Rupee</option>
          <option value="EUR">🇪🇺 EUR - Euro</option>
          <option value="GBP">🇬🇧 GBP - British Pound</option>
          <option value="JPY">🇯🇵 JPY - Japanese Yen</option>
        </select>
      </div>

      <div class="swap-row">
        <button class="swap-btn" id="swapBtn"
          type="button" aria-label="Swap currencies">⇅</button>
      </div>

      <div class="field">
        <label for="toCurrency">To currency</label>
        <select id="toCurrency">
          <option value="USD" selected>🇺🇸 USD - US Dollar</option>
          <option value="INR">🇮🇳 INR - Indian Rupee</option>
          <option value="EUR">🇪🇺 EUR - Euro</option>
          <option value="GBP">🇬🇧 GBP - British Pound</option>
          <option value="JPY">🇯🇵 JPY - Japanese Yen</option>
        </select>
      </div>

      <button class="convert-btn" id="convertBtn" type="button">
        Convert Currency
      </button>

      <div class="result" aria-live="polite">
        <p class="result-label">Converted amount</p>
        <div id="resultAmount">—</div>
        <p id="rateInfo">Exchange rate will appear here.</p>
      </div>

      <p id="status" role="status"></p>

      <div class="popular">
        <h3>Popular currencies</h3>
        <div class="currency-list">
          <button class="currency-chip" data-currency="USD">🇺🇸 USD</button>
          <button class="currency-chip" data-currency="INR">🇮🇳 INR</button>
          <button class="currency-chip" data-currency="EUR">🇪🇺 EUR</button>
          <button class="currency-chip" data-currency="GBP">🇬🇧 GBP</button>
          <button class="currency-chip" data-currency="JPY">🇯🇵 JPY</button>
        </div>
      </div>
    </section>

    <footer>
      <p>Currency Converter.top © 2026</p>
      <p>Rates are indicative and may differ from bank rates.</p>
    </footer>
  </main>

  <script>
    const amountInput = document.getElementById("amount");
    const fromCurrency = document.getElementById("fromCurrency");
    const toCurrency = document.getElementById("toCurrency");
    const resultAmount = document.getElementById("resultAmount");
    const rateInfo = document.getElementById("rateInfo");
    const status = document.getElementById("status");
    const convertBtn = document.getElementById("convertBtn");
    const swapBtn = document.getElementById("swapBtn");

    const symbols = {
      USD: "$",
      INR: "₹",
      EUR: "€",
      GBP: "£",
      JPY: "¥"
    };

    // Cache rates to avoid unnecessary API requests.
    const rateCache = new Map();

    function formatMoney(value, currency) {
      return new Intl.NumberFormat("en", {
        style: "currency",
        currency: currency,
        maximumFractionDigits: currency === "JPY" ? 2 : 4
      }).format(value);
    }

    async function convertCurrency() {
      const amount = Number(amountInput.value);
      const from = fromCurrency.value;
      const to = toCurrency.value;

      if (amountInput.value.trim() === "" ||
          !Number.isFinite(amount) || amount < 0) {
        status.textContent = "Please enter a valid non-negative amount.";
        return;
      }

      if (amount > 1e15) {
        status.textContent = "Please enter a smaller amount.";
        return;
      }

      convertBtn.disabled = true;
      convertBtn.textContent = "Converting...";
      status.textContent = "";
      resultAmount.textContent = "Loading...";
      rateInfo.textContent = "";

      try {
        let rate;

        if (from === to) {
          rate = 1;
        } else {
          const cached = rateCache.get(from);
          const now = Date.now();

          if (cached && now - cached.time < 5 * 60 * 1000) {
            rate = cached.rates[to];
          }

          if (rate === undefined) {
            const response = await fetch(
              `https://open.er-api.com/v6/latest/${from}`
            );

            if (!response.ok) {
              throw new Error("Unable to fetch exchange rates.");
            }

            const data = await response.json();

            if (data.result !== "success" || !data.rates) {
              throw new Error("Exchange rate data is unavailable.");
            }

            rateCache.set(from, {
              time: now,
              rates: data.rates
            });

            rate = data.rates[to];
          }
        }

        if (!Number.isFinite(rate) || rate <= 0) {
          throw new Error("Rate not available for this currency.");
        }

        const converted = amount * rate;

        resultAmount.textContent = formatMoney(converted, to);
        rateInfo.textContent =
          `1 ${from} = ${rate.toLocaleString("en", {
            maximumFractionDigits: 6
          })} ${to}`;

        status.textContent = "Exchange rate loaded successfully.";
      } catch (error) {
        resultAmount.textContent = "Unavailable";
        rateInfo.textContent = "Please check your connection and try again.";
        status.textContent = error.message;
      } finally {
        convertBtn.disabled = false;
        convertBtn.textContent = "Convert Currency";
      }
    }

    convertBtn.addEventListener("click", convertCurrency);

    swapBtn.addEventListener("click", () => {
      const previousFrom = fromCurrency.value;
      fromCurrency.value = toCurrency.value;
      toCurrency.value = previousFrom;
      convertCurrency();
    });

    amountInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") convertCurrency();
    });

    document.querySelectorAll(".currency-chip").forEach((button) => {
      button.addEventListener("click", () => {
        const currency = button.dataset.currency;

        if (currency === fromCurrency.value) {
          toCurrency.value = currency === "USD" ? "INR" : "USD";
        } else {
          toCurrency.value = currency;
        }

        convertCurrency();
      });
    });

    // Refresh when either currency changes.
    fromCurrency.addEventListener("change", convertCurrency);
    toCurrency.addEventListener("change", convertCurrency);

    // Show an initial conversion on page load.
    convertCurrency();
  </script>
</body>
</html>
